name: step-local
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${STEP_DB_NAME:?Run deploy/configure.py}
      POSTGRES_USER: ${STEP_DB_USER:?Run deploy/configure.py}
      POSTGRES_PASSWORD: ${STEP_DB_PASSWORD:?Run deploy/configure.py}
    volumes:
      - step-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - step-private:/app/private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    command: ["python", "manage.py", "step_tick", "--loop", "--interval", "30"]
    volumes:
      - step-private:/app/private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_STEP_API_URL: ${NEXT_PUBLIC_STEP_API_URL:?Run deploy/configure.py}
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  step-postgres:
  step-private:
