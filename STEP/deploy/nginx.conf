upstream ack_step_api {
    server 127.0.0.1:18085;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name step-api.ack-techs.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/server-ip-acme;
        try_files $uri =404;
    }
    location / { return 308 https://step-api.ack-techs.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name step-api.ack-techs.com;
    ssl_certificate /etc/letsencrypt/live/step-api.ack-techs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/step-api.ack-techs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # Existing shared format excludes reset/callback tokens in query strings.
    access_log /var/log/nginx/ack-api-domain-access.log ack_api_domain;
    error_log /var/log/nginx/ack-api-domain-error.log crit;
    client_max_body_size 21m;
    gzip on;
    gzip_types application/json application/problem+json;
    gzip_min_length 256;
    gzip_vary on;

    location /static/ {
        alias /opt/step/STEP/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://ack_step_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
