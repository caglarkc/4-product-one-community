# Bootstrap before the exact certificate is issued. No plaintext API traffic.
server {
    listen 80;
    listen [::]:80;
    server_name step-api.ack-techs.com;
    access_log /var/log/nginx/ack-api-domain-access.log ack_api_domain;
    error_log /var/log/nginx/ack-api-domain-error.log crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/server-ip-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
