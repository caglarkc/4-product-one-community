name: step

x-app: &app
  image: step-backend:local
  build: ../backend
  env_file: ../.env.hosted
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  volumes:
    - step-private:/app/private
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${STEP_DB_NAME:?STEP_DB_NAME required}
      POSTGRES_USER: ${STEP_DB_USER:?STEP_DB_USER required}
      POSTGRES_PASSWORD: ${STEP_DB_PASSWORD:?STEP_DB_PASSWORD required}
    volumes:
      - step-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    <<: *app
    mem_limit: 512m
    command: [gunicorn, config.wsgi:application, --bind, "0.0.0.0:8000", --workers, "2", --threads, "2", --timeout, "60", --keep-alive, "5"]
    ports:
      - "127.0.0.1:18085:8000"
    volumes:
      - step-private:/app/private
      - ../static:/app/static
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    mem_limit: 256m
    command: [python, manage.py, step_tick, --loop, --interval, "30"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  step-postgres:
  step-private:
